<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioShelf</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Playfair Display', serif;
            margin: 0;
            padding: 0;
            background: url('https://www.toptal.com/designers/subtlepatterns/uploads/old_map.png');
            color: #dab88d;
        }
        header {
            background: #c19a6b;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #logo {
            font-size: 28px;
            font-weight: bold;
        }
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #3a1c1c;
            font-size: 18px;
        }
        #search-box {
            padding: 8px;
            width: 250px;
            border-radius: 5px;
            border: 1px solid #dab88d;
        }
        button {
            padding: 8px 15px;
            background: #dab88d;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        button:hover {
            background: #b5835a;
        }
        #results {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding: 20px;
        }
        .book {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin: 10px;
            width: 180px;
            text-align: center;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.1);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        #cart-section {
            background: white;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
            box-shadow: 3px 3px 15px rgba(0,0,0,0.1);
        }
        .cart-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            opacity: 0;
            transform: translateX(-20px);
            animation: slideIn 0.5s ease-in-out forwards;
        }
        .cart-item img {
            width: 50px;
            margin-right: 15px;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <header>
        <div id="logo">BiblioShelf</div>
        <input type="text" id="search-box" placeholder="Search for books...">
        <button onclick="searchBooks()">Search</button>
        <nav>
            <a href="#">Home</a>
            <a href="#">Categories</a>
            <a href="#">Award Winners</a>
            <a href="#">Authors</a>
            <a href="#">Contact Us</a>
        </nav>
    </header>

    <main>
        <div id="results"></div>
    </main>

    <section id="cart-section" style="display: none;">
        <h2>Your Cart</h2>
        <div id="cart"></div>
        <button onclick="clearCart()">Clear Cart</button>
        <button onclick="hideCart()">Back to Search</button>
    </section>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        async function searchBooks() {
            const query = document.getElementById('search-box').value.trim();
            if (!query) return alert("Please enter a search term!");

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';
            
            const response = await fetch('https://www.googleapis.com/books/v1/volumes?q=${query}');
            const data = await response.json();
            
            if (!data.items) {
                resultsDiv.innerHTML = "<p>No books found.</p>";
                return;
            }

            data.items.forEach((book, index) => {
                const bookInfo = book.volumeInfo;
                const bookElement = document.createElement('div');
                bookElement.classList.add('book');
                bookElement.style.animationDelay = '${index * 0.1}s'; // Staggered animation

                bookElement.innerHTML = `
                    <img src="${bookInfo.imageLinks?.thumbnail || 'placeholder.jpg'}" alt="Book Cover">
                    <h3>${bookInfo.title}</h3>
                    <p>${bookInfo.authors?.join(', ') || 'Unknown Author'}</p>
                    <button onclick="addToCart('${bookInfo.title}', '${bookInfo.imageLinks?.thumbnail || 'placeholder.jpg'}')">Add to Cart</button>
                `;

                setTimeout(() => {
                    resultsDiv.appendChild(bookElement);
                }, index * 100);
            });
        }

        function addToCart(title, image) {
            if (cart.some(book => book.title === title)) {
                alert("Already in cart!");
                return;
            }
            cart.push({ title, image });
            localStorage.setItem('cart', JSON.stringify(cart));
            showCart();
        }

        function showCart() {
            updateCart();
            document.getElementById('cart-section').style.display = 'block';
            document.querySelector('main').style.display = 'none';
        }

        function updateCart() {
            const cartDiv = document.getElementById('cart');
            cartDiv.innerHTML = '';
            if (cart.length === 0) {
                cartDiv.innerHTML = "<p>Your cart is empty.</p>";
                return;
            }
            cart.forEach((book, index) => {
                const cartItem = document.createElement('div');
                cartItem.classList.add('cart-item');
                cartItem.style.animationDelay = '${index * 0.1}s'; // Staggered animation
                cartItem.innerHTML = `
                    <img src="${book.image}" alt="Book Cover">
                    <h3>${book.title}</h3>
                    <button onclick="removeFromCart('${book.title}')">Remove</button>
                `;
                setTimeout(() => {
                    cartDiv.appendChild(cartItem);
                }, index * 100);
            });
        }

        function removeFromCart(title) {
            cart = cart.filter(book => book.title !== title);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCart();
        }

        function hideCart() {
            document.getElementById('cart-section').style.display = 'none';
            document.querySelector('main').style.display = 'block';
        }

        function clearCart() {
            cart = [];
            localStorage.removeItem('cart');
            updateCart();
        }
    </script>
</body>
</html>
